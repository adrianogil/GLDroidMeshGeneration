plugins {
    id 'com.android.application'
}

android {
    namespace "com.gillabs.gldev.gldroidmeshgeneration"
    compileSdk 34

    defaultConfig {
        applicationId "com.gillabs.gldev.gldroidmeshgeneration"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
